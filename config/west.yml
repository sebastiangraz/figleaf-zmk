manifest:
  defaults:
    # Zephyr 4.1 / HWMv2 board conventions are only on main until the next
    # tagged release; pin back to a release (v0.4+) once one is available.
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
  self:
    path: config
